name: Build TukTuk APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: توليد مجلد Android
        run: flutter create . --project-name tuktuk_app --org com.example --platforms android

      - name: إعداد Firebase
        run: |
          test -f google-services.json || { echo 'google-services.json غير موجود'; exit 1; }
          cp google-services.json android/app/google-services.json

      - name: إعداد Android SDK 35 و Firebase
        shell: bash
        run: |
          set -e

          # يدعم ملفات Gradle الحديثة والقديمة التي ينشئها Flutter.
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Version)?[[:space:]]*[=:][[:space:]]*flutter\.compileSdkVersion/compileSdkVersion = 35/g' "$f" || true
              sed -i -E 's/minSdk(Version)?[[:space:]]*[=:][[:space:]]*flutter\.minSdkVersion/minSdkVersion = 23/g' "$f" || true
            fi
          done

          # إذا كان الملف بصيغة Groovy، اضبط القيم مباشرة.
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle || true
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 23/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
          fi

          # Firebase plugin في settings.gradle / settings.gradle.kts حسب القالب.
          if [ -f android/settings.gradle ]; then
            grep -q 'com.google.gms.google-services' android/settings.gradle || \
              sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          elif [ -f android/settings.gradle.kts ]; then
            grep -q 'com.google.gms.google-services' android/settings.gradle.kts || \
              sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            grep -q 'com.google.gms.google-services' android/app/build.gradle || \
              sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            grep -q 'com.google.gms.google-services' android/app/build.gradle.kts || \
              sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          fi

          # صلاحيات الإنترنت والموقع.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST" || sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST" || sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"

      - name: تثبيت الحزم
        run: |
          flutter clean
          rm -rf .dart_tool pubspec.lock
          flutter pub get

      - name: فحص نسخة Geolocator
        run: flutter pub deps --style=compact | grep -E 'geolocator(_android)? ' || true

      - name: إصلاح geolocator_android قبل Gradle
        shell: bash
        run: |
          set -e

          echo "===== البحث عن geolocator_android ====="
          find "$HOME/.pub-cache/hosted/pub.dev" -path "*/geolocator_android-*/android/build.gradle" -print

          FILES=$(find "$HOME/.pub-cache/hosted/pub.dev" -path "*/geolocator_android-*/android/build.gradle" -type f)

          if [ -z "$FILES" ]; then
            echo "ERROR: geolocator_android build.gradle غير موجود"
            exit 1
          fi

          for f in $FILES; do
            echo "===== إصلاح: $f ====="

            sed -i               -e 's/flutter\.compileSdkVersion/35/g'               -e 's/flutter\.minSdkVersion/23/g'               -e 's/flutter\.targetSdkVersion/35/g'               "$f"

            echo "--- بعد الإصلاح ---"
            grep -n -E 'compileSdk|minSdk|targetSdk|flutter\.' "$f" || true

            if grep -q 'flutter\.compileSdkVersion' "$f"; then
              echo "ERROR: ما زال flutter.compileSdkVersion موجودًا"
              exit 1
            fi

            if grep -q 'flutter\.minSdkVersion' "$f"; then
              echo "ERROR: ما زال flutter.minSdkVersion موجودًا"
              exit 1
            fi
          done

      - name: بناء APK Release
        shell: bash
        run: |
          set -e
          flutter build apk --release --verbose

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: tuktuk-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
