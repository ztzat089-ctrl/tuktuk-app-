name: Build TukTuk APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: توليد ملفات منصة أندرويد (android/)
        run: flutter create --platforms=android --org com.example --project-name tuktuk_app .

      - name: إضافة ملف google-services.json
        run: cp firebase_config/google-services.json android/app/google-services.json

      - name: تفعيل إضافة Google Services بـ Gradle
        run: |
          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts

      - name: رفع compileSdk وtargetSdk إلى 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle.kts
            sed -i 's/flutter.targetSdkVersion/36/' android/app/build.gradle.kts
            cat android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle
            sed -i 's/flutter.targetSdkVersion/36/' android/app/build.gradle
            cat android/app/build.gradle
          else
            echo "لم يتم العثور على ملف build.gradle"
            find android -name "build.gradle*"
            exit 1
          fi

      - name: تثبيت الحزم (packages)
        run: flutter pub get

      - name: بناء ملف APK
        run: flutter build apk --release

      - name: رفع ملف APK كمخرجات (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tuktuk-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
